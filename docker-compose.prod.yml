services:
  db:
    image: postgres:16
    container_name: task-manager-db
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/minakamal12/task-manager:latest
    container_name: task-manager-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/task_manager
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

  